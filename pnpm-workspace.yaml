packages:
  - apps/*
  - packages/*
  - packages/connectors/*
  - db

# One place for shared dependency versions. Renovate proposes upgrades.
catalog:
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@eslint/js': ^9.39.5
  '@nestjs/common': ^11.2.7
  '@nestjs/core': ^11.2.7
  '@fastify/cors': ^11.3.0
  '@fastify/helmet': ^13.0.2
  '@fastify/static': ^10.1.2
  '@nestjs/platform-fastify': ^11.2.7
  '@nestjs/swagger': ^11.4.7
  '@nestjs/testing': ^11.2.7
  '@swc/core': ^1.16.13
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^22.20.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.2.0
  eslint: ^9.39.5
  eslint-config-prettier: ^10.0.0
  eslint-plugin-import-x: ^4.17.1
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.13.0
  husky: ^9.1.7
  jsdom: ^30.1.2
  jose: ^6.2.12
  kysely: ^0.29.6
  kysely-codegen: ^0.20.0
  nestjs-zod: ^5.5.0
  node-pg-migrate: ^9.0.0
  openapi-fetch: ^0.17.0
  openapi-typescript: ^7.13.0
  pg: ^8.23.1
  pg-connection-string: ^2.14.1
  '@types/pg': ^8.23.1
  lint-staged: ^17.6.0
  prettier: ^3.9.9
  react: ^19.3.0
  react-dom: ^19.3.0
  react-router: ^7.18.4
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  tailwindcss: ^4.3.3
  turbo: ^2.11.7
  '@swc-node/register': ^1.12.1
  typescript: ~5.9.3
  typescript-eslint: ^8.71.1
  unplugin-swc: ^2.0.0
  vite: ^7.3.7
  vitest: ^3.2.7
  zod: ^4.6.5
  '@radix-ui/react-dialog': ^1.2.0
  '@radix-ui/react-slot': ^1.4.0
  '@radix-ui/react-tabs': ^1.1.22
  '@testing-library/user-event': ^14.6.7
  '@radix-ui/react-dropdown-menu': ^2.1.25
  '@axe-core/playwright': ^4.13.0
  '@playwright/test': ^1.64.0
  axe-core: ^4.14.0
  '@arcgis/core': 5.1.27
  '@tanstack/react-query': ^5.104.2
  msw: ^3.0.3

# Dependencies allowed to run install scripts (everything else is blocked).
allowBuilds:
  '@scarf/scarf': false # swagger-ui-dist telemetry; not needed
  '@swc/core': true
  '@vaadin/vaadin-usage-statistics': false # pulled in by @arcgis/core; usage telemetry, not needed (S0-09 security review I6)
  esbuild: true
  unrs-resolver: true

# Security: platform-fastify pins an older fastify; advisories fixed in 5.12.5 (S1-03 review).
overrides:
  fastify: ^5.12.5
