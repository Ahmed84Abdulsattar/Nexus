packages:
  - apps/*
  - packages/*
  - packages/connectors/*

# One place for shared dependency versions. Renovate proposes upgrades.
catalog:
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@eslint/js': ^9.39.5
  '@nestjs/common': ^11.2.7
  '@nestjs/core': ^11.2.7
  '@fastify/static': ^9.0.0
  '@nestjs/platform-fastify': ^11.2.7
  '@nestjs/swagger': ^11.4.7
  '@nestjs/testing': ^11.2.7
  '@swc/core': ^1.16.13
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^22.20.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.2.0
  eslint: ^9.39.5
  eslint-config-prettier: ^10.0.0
  eslint-plugin-import-x: ^4.17.1
  globals: ^17.13.0
  husky: ^9.1.7
  jose: ^6.2.12
  nestjs-zod: ^5.5.0
  openapi-fetch: ^0.17.0
  openapi-typescript: ^7.13.0
  lint-staged: ^17.6.0
  prettier: ^3.9.9
  react: ^19.3.0
  react-dom: ^19.3.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  tailwindcss: ^4.3.3
  turbo: ^2.11.7
  '@swc-node/register': ^1.12.1
  typescript: ~5.9.3
  typescript-eslint: ^8.71.1
  unplugin-swc: ^2.0.0
  vite: ^7.3.7
  vitest: ^3.2.7
  zod: ^4.6.5

# Dependencies allowed to run install scripts (everything else is blocked).
allowBuilds:
  '@scarf/scarf': false # swagger-ui-dist telemetry; not needed
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
